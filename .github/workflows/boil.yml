name: Build Raven

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of mirkobrombin/raven"
        default: main
  push:
    paths: [".github/workflows/raven.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: fedora:latest

    steps:
      - name: Install dependencies
        run: |
          dnf -y install \
            git make cmake ninja-build gcc gcc-c++ clang python3 bison flex patch \
            tar zstd xz unzip curl which findutils \
            wine-devel \
            mingw64-gcc mingw64-gcc-c++ mingw32-gcc mingw32-gcc-c++ \
            wayland-devel wayland-protocols-devel libxkbcommon-devel \
            pixman-devel freetype-devel vulkan-loader-devel vulkan-headers \
            openssl-devel \
            libxcb-devel xcb-util-devel libxkbcommon-x11-devel

      - name: Clone Raven
        run: |
          git clone https://github.com/mirkobrombin/raven.git
          cd raven
          git checkout "${{ inputs.ref || 'main' }}"

      - name: Restore components cache
        id: cache
        uses: actions/cache@v4
        with:
          path: raven/components
          key: raven-components-${{ runner.os }}-${{ hashFiles('raven/scripts/provision-*.py') }}

      - name: Provision components
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: raven
        run: |
          set -eux
          python3 scripts/provision-rtl.py        --output components/rtl
          python3 scripts/provision-controls.py   --output components/controls
          python3 scripts/provision-controls.py   --arch x86 --output components/controls32
          python3 scripts/provision-installer.py  --output components/installer
          python3 scripts/provision-installer.py  --arch x86 --output components/installer32
          python3 scripts/provision-graphics.py   --destination components/graphics
          python3 scripts/provision-roots.py      --output components/roots
          python3 scripts/provision-text.py       --output components/text

      - name: Configure
        working-directory: raven
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRAVEN_RTL_COMPONENT_PATH=$PWD/components/rtl/raven-rtl.dll \
            -DRAVEN_CONTROLS_COMPONENT_DIR=$PWD/components/controls \
            -DRAVEN_CONTROLS32_COMPONENT_DIR=$PWD/components/controls32 \
            -DRAVEN_INSTALLER_COMPONENT_DIR=$PWD/components/installer \
            -DRAVEN_INSTALLER32_COMPONENT_DIR=$PWD/components/installer32 \
            -DRAVEN_DXVK_PE64_DIR=$PWD/components/graphics/dxvk/pe64 \
            -DRAVEN_DXVK_PE32_DIR=$PWD/components/graphics/dxvk/pe32 \
            -DRAVEN_VKD3D_PE64_DIR=$PWD/components/graphics/vkd3d-proton/pe64 \
            -DRAVEN_ROOT_CERTIFICATE_DIRECTORY=$PWD/components/roots \
            -DRAVEN_SKIA_SOURCE=$PWD/components/text/skia \
            -DRAVEN_SKIA_LIBRARY=$PWD/components/text/cpu-fonts/libskia.a \
            -DRAVEN_FONT_DIRECTORY=$PWD/components/text/fonts

      - name: Build
        working-directory: raven
        run: cmake --build build -j"$(nproc)"

      - name: Package build + components
        working-directory: raven
        run: |
          tar --zstd -cf ../raven-build.tar.zst build components
          ls -lh ../raven-build.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raven-build
          path: raven-build.tar.zst
          retention-days: 14
          compression-level: 0
